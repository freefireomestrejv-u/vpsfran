# Compose de PRODUÇÃO (VPS): sobe o Caddy (HTTPS automático) na frente do app.
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  caddy:
    image: caddy:2-alpine
    container_name: wa-akg-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # Worker da recuperação de carrinho (só na VPS): polling no Supabase + envio via app.
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: wa-akg-worker
    restart: always
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - WAAKG_URL=http://app:3000
      - WAAKG_API_KEY=${WAAKG_API_KEY}
      - WAAKG_SESSION_ID=${WAAKG_SESSION_ID}
      - AFFILIATE_CODE=${AFFILIATE_CODE:-}
      - NOME_MARCA=${NOME_MARCA:-Equipe Renew Veins}
      - HORA_INICIO=${WORKER_HORA_INICIO:-0}
      - HORA_FIM=${WORKER_HORA_FIM:-24}
    depends_on:
      - app

  # Worker de afiliada (opcional). Preencha AFILIADA_* no .env e suba com:
  #   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile afiliada up -d --build worker-afiliada
  worker-afiliada:
    profiles: ["afiliada"]
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: wa-akg-worker-afiliada
    restart: always
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - WAAKG_URL=http://app:3000
      - WAAKG_API_KEY=${WAAKG_API_KEY}
      - WAAKG_SESSION_ID=${AFILIADA_SESSION_ID}
      - AFFILIATE_CODE=${AFILIADA_CODE}
      - NOME_MARCA=${AFILIADA_MARCA:-Afiliada}
      - HORA_INICIO=${WORKER_HORA_INICIO:-0}
      - HORA_FIM=${WORKER_HORA_FIM:-24}
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
